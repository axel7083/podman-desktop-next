<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icons/podman-desktop.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Podman Desktop · next (mockup)</title>
    <script>
      // apply theme before first paint (URL param > stored > dark).
      // Storage is namespaced per version (`pdn:<version>:theme`, see src/lib/version.ts); the
      // deployed version is the last path segment (`/podman-desktop-next/v1/`), `dev` at the root.
      (function () {
        try {
          var p = new URLSearchParams(location.search).get('theme');
          var seg = location.pathname.split('/').filter(Boolean);
          var v = seg.length > 1 ? seg[seg.length - 1] : 'dev';
          var t = p || JSON.parse(localStorage.getItem('pdn:' + v + ':theme') || '"dark"');
          document.documentElement.className = t === 'light' ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
