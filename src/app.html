<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icons/podman-desktop.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Podman Desktop · next (mockup)</title>
    <script>
      // apply theme before first paint (URL param > stored > dark)
      (function () {
        try {
          var p = new URLSearchParams(location.search).get('theme');
          var t = p || localStorage.getItem('pdn.theme') || 'dark';
          document.documentElement.className = t === 'light' ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
