# Versioned GitHub Pages: every build lands in its own folder of the gh-pages branch.
#   tag v*        → /<tag>/   (frozen release)
#   push to main  → /next/
#   pull request  → /pr-<n>/  (same-repo PRs only; removed when the PR closes)
# The root versions.json + index.html are regenerated by scripts/pages/update-site.mjs.
name: pages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_PATH: /podman-desktop-next

jobs:
  deploy:
    # fork PRs get a read-only token: no preview for them
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version id
        id: v
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "id=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "kind=pr" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "id=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=next" >> "$GITHUB_OUTPUT"
            echo "kind=preview" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event.action }}" = "closed" ]; then echo "remove=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        if: steps.v.outputs.remove != 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Build
        if: steps.v.outputs.remove != 'true'
        env:
          BASE_PATH: ${{ env.SITE_PATH }}/${{ steps.v.outputs.id }}
          PUBLIC_MOCKUP_VERSION: ${{ steps.v.outputs.id }}
          PUBLIC_MOCKUP_SHA: ${{ steps.v.outputs.sha }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Check out gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git worktree add site FETCH_HEAD
            git -C site checkout -B gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rfq .
          fi

      - name: Update site
        env:
          ID: ${{ steps.v.outputs.id }}
          KIND: ${{ steps.v.outputs.kind }}
          SHA: ${{ steps.v.outputs.sha }}
          REMOVE: ${{ steps.v.outputs.remove }}
        run: |
          touch site/.nojekyll   # serve SvelteKit's _app/ folder
          rm -rf "site/$ID"
          if [ "$REMOVE" = "true" ]; then
            node scripts/pages/update-site.mjs site --remove "$ID"
          else
            cp -r build "site/$ID"
            node scripts/pages/update-site.mjs site --id "$ID" --kind "$KIND" --ref "$SHA"
          fi
          cd site
          git add -A
          if git diff --cached --quiet; then echo "nothing to deploy"; exit 0; fi
          git commit -q -m "deploy: $ID ${SHA::7}${REMOVE:+ (removed)}"
          git push origin gh-pages

      - name: Summary
        if: steps.v.outputs.remove != 'true'
        run: echo "Deployed https://${{ github.repository_owner }}.github.io${{ env.SITE_PATH }}/${{ steps.v.outputs.id }}/" >> "$GITHUB_STEP_SUMMARY"
